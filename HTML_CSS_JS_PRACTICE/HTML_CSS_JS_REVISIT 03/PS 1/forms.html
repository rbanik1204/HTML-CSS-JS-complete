<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms- Lets revise them!</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
    <h2 align="center">Forms - Revisit</h2>
    <form action="/submit" method="POST">
        <div>
            <label for="username">username:</label>
            <input type="username" id="username" name="username" placeholder="Enter your username" required>
        </div>
        <br>
        <div>
            <label for="password">password:</label>
            <input type="paswword" name="password" id="password" placeholder="Enter your password" required>
        </div>
        <br>
        <div>Gender:
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">female</label>
        </div>
        <br>
        <div>
            text: <input type="text" id="text">
        </div>
        <br>
        <div>
            Date:<input type="datetime-local" name="datetime" id="datetime">
        </div>
        <br>
        <div>
            <input type="file" id="fileselect" name="file">
        </div>
        <div>
            <label for="eligibility">Are you eligible:</label>
            <input type="checkbox" id="eligibility" name="myeligibility" checked>
        </div>
        <br>
        <div>
            Write about yourself:
            <br><textarea name="sometext" id=""cols="20" rows="5"></textarea>
        </div>
        <div>
            <input type="submit" value="submit now!">
            <input type="reset" value="reset now!">
        </div>
        <br>
        <div>
            <label for="car">car</label>
            <select name="mycar" id="car">
                <option value="chiron">chiron</option>
                <option value="ferr">ferrari</option>
            </select>
        </div>
    </form>
    <script src="script.js" type="text/javascript"></script>
</body>

</html>
