<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive navbar with hamburger menu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing:border-box;
        }
        body {
            font-family: "poppins",sans-serif;
            font-weight: 500;
            min-height:100vh;
            color:white;
            background:url("background.jpg") no-repeat center;
            background-size: cover;
        }
        .navbar {
            width:100%;
            height:80px;
            position:sticky;
            top:0;
            background: transparent;
            /* box-shadow: 15px 15px 15px 15px rgb(rgb(3, 9, 24), green, blue);  will check later why not working*/
            backdrop-filter: blur(20px);
            z-index:999;
        }
       .navbar-container {
        width:100%;
        height:100%;
        display:flex;
        justify-content: space-between;
        align-items:center;
        padding: 0 1.5rem;
       }
       .navbar-logo {
        font-size: 2rem;
        text-decoration:none;
        font-weight:600;
        color:aliceblue;
        cursor:pointer;
       }
       .navbar-menu {
        display: flex;
        list-style-type:none;
        gap:2rem;
       }
       .navbar-menu li a{
        text-decoration:none;
        color:#fff;
        font-weight: 500;
        padding:3px 20px;
        border:2px solid transparent;
        transition:all 0.7s ease;
        white-space:nowrap;
        /* cursor:pointer; */
       }
       .navbar-menu li a:hover {
        background-color:rgb(102, 102, 151);
        border:2px solid white;
        border-radius:15px;
        transform:scale(0.95);
        color:black;
       }
       .navbar-toggle {
        display:none;
        background:transparent;
        padding:10px;
        border:transparent;
        cursor:pointer;
       }
       .bar {
        display:block;
        width:23px;
        height:3px;
        margin:5px auto;
        background:#fff;
        transition:all 0.7s ease-in-out;
       }
       @media only screen and (max-width:880px) {
        .navbar {
            backdrop-filter:none;

        }
        .navbar-container .navbar-menu {
            flex-direction:column;
            align-items:flex-start;
            gap:1.7rem;
            position:absolute;
            height:100vh;
            width:250px;
            top:0;
            right:0;
            padding:5rem 1.5rem;
            box-shadow:0 10px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
        }
        .navbar-toggle {
            display:block;
            z-index: 999;
        }
       }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">firstNAV</a>
            <button class="navbar-toggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <ul class="navbar-menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Service</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </nav>
</body>
</html>
