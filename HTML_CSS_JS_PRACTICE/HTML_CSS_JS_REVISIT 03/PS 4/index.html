<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header><h1>Semantic Tags</h1></header>
    <nav>This is a navigation bar </nav>
    <aside>Contains content aside from the main content</aside>
    <main>
        <article>
            <figure>
                This is image section where images are put in the following format
                <pre>
                    <code>
                        &lt;figure&gt;
                            &lt;img src="abc.jpg" alt="not available"&gt;
                            &lt;figcaption>This is a sample&lt;/figcaption&gt;
                        &lt;/figure&gt;
                    </code>
                </pre>
            </figure>
            <p>This is a paragraph inside main after figure</p>
        </article>
        <section>This is the section content outside of article element</section>
    </main>
    <footer>Hey i'm footer btw!</footer>
</body>
</html>
