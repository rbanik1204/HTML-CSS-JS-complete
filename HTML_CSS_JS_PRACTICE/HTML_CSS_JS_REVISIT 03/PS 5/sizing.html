<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS sizing units</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box {
            border:2px solid red;
            border-radius:10px;
            width:80vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            height:30vh;
            color:rgb(179, 123, 50);
            background-color: aqua;
            text-align:center;
            margin:20vh auto 0 auto;
            padding:100px 0 100px 0;
        }
        .box p {
            font-size: 1.5em;
            line-height: -20px;
            /* width:30%; */
            border-radius: 15px;
            /* margin:auto; */
            background-color: blanchedalmond;
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a div
        <p>Hello i'm para inside div</p>
    </div>
</body>
</html>
