<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations CSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .parent {
            position:relative;
            width:50vw;
            height:50vh;
            margin:100px auto;
            background-color: aquamarine;
            border: 2px solid red;
            border-radius: 10px;
            box-shadow: 15px 1px 15px 5px red;
        }
        .ball {
            position:absolute;
            width:50px;
            height:50px;
            border-radius: 100%;
            background-color: red;
            bottom:0px;
            left:0px;
            animation: bounce-x 10s ease-out alternate infinite;
        }
        @keyframes bounce-x{
            0% {
                transform: translateX(0px) translateY(0px);
            }
            20%{
                transform: translateX(calc(10.5vw - 100%)) translateY(-200px);
            }
            40% {
                transform: translateX(calc(20.5vw) - 100%) translateY(+200px);
            }

        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="ball"></div>
    </div>
</body>
</html>
