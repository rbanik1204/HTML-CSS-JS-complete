<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width:100vw;
            height:100vh;
        }
        .navbar {
            width:100vw;
            height:10vh;
            background-color: aquamarine;
        }
        .parent {
            width:100%;
            height:70vh;
            background-color: aqua;
            border-radius: 15px;
            text-align: center;/*centers inline element*/
            /* margin:auto; will not work*/
        }
        .child{
            width:35%;
            height:70%;
            display:inline-block;
            background-color:red;
            border-radius: 15px;
            margin-top:20px;
        }
        .child:last-child {
            margin-left:30px;
        }
        .box {
            height:15vh;
            width:70vw;
            background-color:aqua;
            margin:20px auto;
            border-radius: 20px;
            color:black;
            font-size:22px;
            font-weight:600;
            text-align:center;
            padding:25px 25px;
        }
        .footer{
            position:relative;
            top:20px;
            height:8vh;
            width:auto;
            background-color: blanchedalmond;
        }
        img {
            position:sticky;
            width:50px;
            height:50px;
            border-radius: 100%;
            background-color: red;
            border: 2px solid black;
            position:fixed;
            bottom:12px;
            right:20px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <nav class="navbar"></nav>
        <div class="child"></div>
        <div class="child"></div>
    </div>
    <div class="box">Currently we are practicing css</div>
    <div class="footer">
    </div>
    <img src="" alt="not found">
</body>
</html>
